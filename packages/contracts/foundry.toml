[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
# Dependencies come from bun, hoisted to the monorepo root, not git submodules.
libs = ["../../node_modules"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000
