# Everything that is not the browser.
#
#   docker compose --env-file .env.local up db        Postgres, on :5440
#   docker compose --env-file .env.local up feed      the market, on :3210
#   docker compose --env-file .env.local --profile trade up
#
# The env file has to be named. Compose reads `.env` by default and this repo
# keeps one `.env.local` at the root for every service, so without the flag
# every variable below arrives empty and the services quietly run on their
# defaults.
#
# The app reads the feed from the browser, so its URL is the host's, not this
# network's.
services:
  # Postgres for local work, on host port 5440. On AWS this is RDS or Aurora Serverless and this
  # service goes away; nothing in the schema ties it to either.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skech
      POSTGRES_PASSWORD: skech
      POSTGRES_DB: skech
    ports: ["127.0.0.1:5440:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skech"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    ports: ["3230:3230"]
    environment:
      SKECH_NETWORK: ${SKECH_NETWORK:-testnet}
      SOCIAL_FEED_URL: http://feed:3210
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://skech:skech@db:5432/skech}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  feed:
    build: { context: ./services/feed }
    ports: ["3210:3210"]
    environment:
      SKECH_NETWORK: ${SKECH_NETWORK:-testnet}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
    restart: unless-stopped

  trader:
    profiles: ["trade"]
    build: { context: ., dockerfile: services/trader/Dockerfile }
    ports: ["3220:3220"]
    # The trading key is the crown jewel. It arrives as an environment
    # variable here and belongs in a secrets manager in production, decrypted
    # inside this process and nowhere else.
    environment:
      # One switch, here too. It picks the venue, the chain, the market and
      # which of the two key sets below gets used.
      SKECH_NETWORK: ${SKECH_NETWORK:-testnet}
      TRADE_FEED_URL: http://feed:3210
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://skech:skech@db:5432/skech}
      LIGHTER_ACCOUNT_INDEX: ${LIGHTER_ACCOUNT_INDEX}
      LIGHTER_API_KEY_INDEX: ${LIGHTER_API_KEY_INDEX}
      LIGHTER_PRIVATE_KEY: ${LIGHTER_PRIVATE_KEY}
      LIGHTER_MAINNET_ACCOUNT_INDEX: ${LIGHTER_MAINNET_ACCOUNT_INDEX}
      LIGHTER_MAINNET_API_KEY_INDEX: ${LIGHTER_MAINNET_API_KEY_INDEX}
      LIGHTER_MAINNET_PRIVATE_KEY: ${LIGHTER_MAINNET_PRIVATE_KEY}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
    depends_on: [feed]
    restart: unless-stopped

# Named here because a service that mounts a volume it never declares is a
# compose file that has never been run: `docker compose up db` answers
# "refers to undefined volume db" and starts nothing.
volumes:
  db:
